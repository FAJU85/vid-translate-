# Pages CMS configuration (https://pagescms.org): a visual editor for this repository's content.
# Sign in at https://app.pagescms.org with GitHub and open this repository. Saving commits to
# main, and Cloudflare redeploys the website and the bot automatically (about 1-2 minutes).

media:
  input: web/public/images
  output: /images
  categories: [image]

content:
  - name: site
    label: Website
    type: file
    path: content/site.json
    format: json
    fields:
      - name: brand
        label: Branding
        type: object
        fields:
          - name: name
            label: Platform name
            type: string
            description: Shown in the top bar.
          - name: mark
            label: Wordmark
            type: string
            description: Short coloured text in the top bar, shown when there is no logo.
          - name: logo
            label: Logo
            type: image
            description: Shown in the top bar and as the browser-tab icon. SVG or a square PNG works best. Leave empty to show the wordmark.
          - name: accent
            label: Accent colour
            type: string
            description: "Colour code for buttons and highlights, e.g. #fbbf24 (amber) or #38bdf8 (sky blue)."
            pattern:
              regex: "^#[0-9a-fA-F]{3,8}$"
              message: "Use a colour code like #fbbf24."
          - name: footer
            label: Footer text
            type: string
      - name: seo
        label: Browser tab and search results
        type: object
        fields:
          - name: title
            label: Page title
            type: string
          - name: description
            label: Description
            type: text
      - name: translate
        label: Translate page
        type: object
        fields:
          - name: title
            label: Heading
            type: string
          - name: intro
            label: Introduction
            type: text
          - name: link_hint
            label: Hint under the link box
            type: text
      - name: history
        label: My translations page
        type: object
        fields:
          - name: title
            label: Heading
            type: string
      - name: telegram
        label: Telegram page
        type: object
        fields:
          - name: title
            label: Heading
            type: string
          - name: intro
            label: Introduction
            type: text
          - name: steps
            label: Steps
            type: object
            list: true
            fields:
              - name: title
                label: Step title
                type: string
              - name: body
                label: Step text
                type: text

  - name: bot
    label: Telegram bot messages
    type: file
    path: content/bot.json
    format: json
    fields:
      - name: en
        label: English
        type: object
        fields:
          - name: welcome
            label: "Welcome message (/start, /help)"
            type: text
            description: "Keep {lang}: the bot fills it in. Telegram HTML allowed: <b>bold</b>, <i>italic</i>, <code>code</code>."
          - name: not_allowed
            label: "Private bot: not allowed"
            type: string
            description: "Keep {id}: the bot fills it in."
          - name: hint
            label: "Hint when the message is not a file or link"
            type: string
          - name: bad_url
            label: "Unusable link"
            type: string
          - name: youtube_unsupported
            label: "YouTube link refused"
            type: text
          - name: file_too_big
            label: "File larger than 20 MB"
            type: text
          - name: choose
            label: "Ask what to send back"
            type: text
            description: "Keep {lang}: the bot fills it in. Telegram HTML allowed: <b>bold</b>, <i>italic</i>, <code>code</code>."
          - name: btn_soft
            label: "Button: subtitle file"
            type: string
          - name: btn_hard
            label: "Button: video with subtitles"
            type: string
          - name: btn_lang
            label: "Button: change language"
            type: string
          - name: btn_cancel
            label: "Button: cancel"
            type: string
          - name: pick_lang
            label: "Choose a language"
            type: string
          - name: lang_set
            label: "Language changed"
            type: string
            description: "Keep {lang}: the bot fills it in. Telegram HTML allowed: <b>bold</b>, <i>italic</i>, <code>code</code>."
          - name: expired
            label: "Request expired"
            type: string
          - name: rate_limited
            label: "Hourly limit reached"
            type: string
            description: "Keep {n}: the bot fills it in."
          - name: busy
            label: "A video is already in progress"
            type: string
          - name: stage_queued
            label: "Progress: queued"
            type: string
          - name: stage_waking
            label: "Progress: server waking up"
            type: string
          - name: stage_downloading
            label: "Progress: downloading"
            type: string
          - name: stage_transcribing
            label: "Progress: transcribing"
            type: string
          - name: stage_translating
            label: "Progress: translating"
            type: string
          - name: stage_rendering
            label: "Progress: burning subtitles"
            type: string
          - name: done
            label: "Finished"
            type: string
            description: "Keep {title}: the bot fills it in. Telegram HTML allowed: <b>bold</b>, <i>italic</i>, <code>code</code>."
          - name: done_caption
            label: "Caption of the subtitle file"
            type: text
            description: "Keep {src}, {tgt}, {title}: the bot fills it in."
          - name: video_caption
            label: "Caption of the video"
            type: string
            description: "Keep {title}: the bot fills it in."
          - name: video_link
            label: "Video too large: download link"
            type: text
            description: "Keep {url}: the bot fills it in."
          - name: srt_link
            label: "Subtitle download link"
            type: text
            description: "Keep {url}: the bot fills it in."
          - name: audio_only_note
            label: "Source has no picture"
            type: string
          - name: cancelled
            label: "Cancelled"
            type: string
          - name: nothing_to_cancel
            label: "Nothing to cancel"
            type: string
          - name: no_jobs
            label: "No jobs yet (/status)"
            type: string
          - name: failed
            label: "Translation failed (wraps the error below)"
            type: string
            description: "Keep {reason}: the bot fills it in."
          - name: untitled
            label: "Title for a video without a name"
            type: string
          - name: E_URL_INVALID
            label: "Error: link not supported"
            type: string
          - name: E_DOWNLOAD_FAILED
            label: "Error: download failed"
            type: string
            description: "Keep {detail}: the bot fills it in."
          - name: E_SITE_BLOCKED
            label: "Error: site refused the server"
            type: text
          - name: E_VIDEO_TOO_LONG
            label: "Error: video too long"
            type: string
            description: "Keep {detail}: the bot fills it in."
          - name: E_FILE_TOO_LARGE
            label: "Error: file too large"
            type: string
          - name: E_MEDIA_INVALID
            label: "Error: unreadable file"
            type: string
          - name: E_NO_SPEECH
            label: "Error: no speech"
            type: string
          - name: E_ASR_FAILED
            label: "Error: speech recognition failed"
            type: string
          - name: E_NMT_FAILED
            label: "Error: translation failed"
            type: string
            description: "Keep {detail}: the bot fills it in."
          - name: E_RENDER_FAILED
            label: "Error: rendering failed"
            type: string
          - name: E_BACKEND_DOWN
            label: "Error: server not responding"
            type: string
          - name: E_BACKEND_RESTARTED
            label: "Error: server restarted"
            type: string
          - name: E_INTERNAL
            label: "Error: unexpected"
            type: string
