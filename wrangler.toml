name = "vid-translate"
# This file sits at the repository root because Cloudflare Workers Builds runs
# `npx wrangler deploy` from the root. The Worker's code lives in worker/.
main = "worker/src/index.ts"
compatibility_date = "2025-10-01"
workers_dev = true

[observability]
enabled = true

# The website (web/) is built on every deploy and served by this same Worker, so the site and
# its API share one URL. Requests for the API, the bot and admin routes always reach the code.
[build]
command = "npm ci --prefix web && npm run build --prefix web"

[assets]
directory = "web/dist"
not_found_handling = "single-page-application"
run_worker_first = ["/api/*", "/telegram/*", "/admin/*"]

[vars]
# URL of your Hugging Face Space: https://<user>-<space-name>.hf.space
BACKEND_URL = "https://vooom-kavox.hf.space"
# Your Cloudflare Pages site (comma-separated list), or "*" to allow any website.
ALLOWED_ORIGINS = "*"
DEFAULT_TARGET_LANG = "ar"
MAX_JOBS_PER_HOUR = "5"
MAX_UPLOAD_MB = "500"
# Optional: restrict the bot to these Telegram chat ids (comma-separated).
# ALLOWED_CHAT_IDS = "123456789"

# Secrets (set with `npx wrangler secret put NAME`):
#   SHARED_SECRET            - same value as on the Hugging Face Space
#   TELEGRAM_BOT_TOKEN       - from @BotFather
#   TELEGRAM_WEBHOOK_SECRET  - any random string (letters, digits, _ and - only)

[[d1_databases]]
binding = "DB"
database_name = "tarjim-video"
database_id = "a341760a-5457-4e7b-a2e4-1c21c88f0515"

[triggers]
# Retries hand-offs while the Space wakes up and reconciles stuck jobs.
crons = ["* * * * *"]
