name = "vid-translate"
# This file sits at the repository root because Cloudflare Workers Builds runs
# `npx wrangler deploy` from the root. The Worker's code lives in worker/.
main = "worker/src/index.ts"
compatibility_date = "2025-10-01"
workers_dev = true

[observability]
enabled = true

# The website (web/) is built on every deploy and served by this same Worker, so the site and
# its API share one URL. Every address reaches the code first (short video links /<id>, profiles
# /@handle, the API, the bot), except the home page and the website's own files, which are served
# directly (free, and they do not count as Worker requests); other pages are passed on to ASSETS.
[build]
command = "npm ci --prefix web && npm run build --prefix web"

[assets]
directory = "web/dist"
binding = "ASSETS"
not_found_handling = "single-page-application"
run_worker_first = ["/*", "!/", "!/index.html", "!/assets/*", "!/sw.js", "!/manifest.webmanifest", "!/offline.html", "!/offline"]

[vars]
# URL of your Hugging Face Space: https://<user>-<space-name>.hf.space
BACKEND_URL = "https://vooom-kavox.hf.space"
# Your Cloudflare Pages site (comma-separated list), or "*" to allow any website.
ALLOWED_ORIGINS = "*"
DEFAULT_TARGET_LANG = "ar"
MAX_JOBS_PER_HOUR = "5"
MAX_UPLOAD_MB = "500"
# "1" to count and charge credits (see README → Accounts and credits). Off until free allowances and payments exist.
CREDITS_ENABLED = "0"
# Telegram Stars per US dollar for prices in the bot (packs and plans).
STARS_PER_USD = "50"
# Optional: restrict the bot to these Telegram chat ids (comma-separated).
# ALLOWED_CHAT_IDS = "123456789"

# Secrets (set with `npx wrangler secret put NAME`):
#   SHARED_SECRET            - same value as on the Hugging Face Space
#   TELEGRAM_BOT_TOKEN       - from @BotFather
#   TELEGRAM_WEBHOOK_SECRET  - any random string (letters, digits, _ and - only)

[[d1_databases]]
binding = "DB"
database_name = "tarjim-video"
database_id = "a341760a-5457-4e7b-a2e4-1c21c88f0515"

# Cloudflare R2 (10 GB free, no download fees): subscribers' own video endings and, later,
# shared videos. Create the bucket once: npx wrangler r2 bucket create kavox-media
[[r2_buckets]]
binding = "MEDIA"
bucket_name = "kavox-media"

# Preview deploys (Workers Builds on pull requests) use their own empty database and bucket, so a
# preview never touches real accounts, credits or files. Payments stay off there.
[previews.vars]
BACKEND_URL = "https://vooom-kavox.hf.space"
ALLOWED_ORIGINS = "*"
DEFAULT_TARGET_LANG = "ar"
MAX_JOBS_PER_HOUR = "5"
MAX_UPLOAD_MB = "500"
CREDITS_ENABLED = "0"
STARS_PER_USD = "50"

[[previews.d1_databases]]
binding = "DB"
database_name = "tarjim-video-preview"
database_id = "519d3acb-a5df-4524-94f8-1ea10cd6457f"

[[previews.r2_buckets]]
binding = "MEDIA"
bucket_name = "kavox-media-preview"

[triggers]
# Retries hand-offs while the Space wakes up and reconciles stuck jobs.
crons = ["* * * * *"]
