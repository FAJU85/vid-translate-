name: Sync secrets to Cloudflare and Hugging Face

# Single source of truth for secrets: GitHub repository secrets
# (Settings → Secrets and variables → Actions). Run this workflow from the Actions tab
# after adding or changing one. Secrets left empty in GitHub are skipped, never deleted.
#
#   SHARED_SECRET            → Worker and Space
#   TELEGRAM_BOT_TOKEN       → Worker
#   TELEGRAM_WEBHOOK_SECRET  → Worker
#   GEMINI_API_KEY           → Space (optional)
#   YTDLP_COOKIES            → Space (optional)
#
# Needed to reach the platforms (never copied anywhere):
#   CLOUDFLARE_API_TOKEN  "Edit Cloudflare Workers" API token
#   CLOUDFLARE_ACCOUNT_ID Cloudflare account id
#   HF_TOKEN              Hugging Face token with write access to the Space

on:
  workflow_dispatch:

concurrency:
  group: sync-secrets
  cancel-in-progress: false

env:
  SPACE_ID: vooom/Kavox
  WORKER_URL: https://vid-translate.ee-ee455.workers.dev

jobs:
  sync:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Cloudflare Worker secrets
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          SHARED_SECRET: ${{ secrets.SHARED_SECRET }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_WEBHOOK_SECRET: ${{ secrets.TELEGRAM_WEBHOOK_SECRET }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "::warning::CLOUDFLARE_API_TOKEN or CLOUDFLARE_ACCOUNT_ID is not set; skipping the Worker."
            exit 0
          fi
          python3 - > "$RUNNER_TEMP/worker-secrets.json" <<'PY'
          import json, os
          keys = ["SHARED_SECRET", "TELEGRAM_BOT_TOKEN", "TELEGRAM_WEBHOOK_SECRET"]
          print(json.dumps({k: os.environ[k] for k in keys if os.environ.get(k)}))
          PY
          python3 -c "import json,sys; print('Worker secrets to set:', ', '.join(json.load(open(sys.argv[1]))) or 'none')" "$RUNNER_TEMP/worker-secrets.json"
          npx --yes wrangler@4 secret bulk "$RUNNER_TEMP/worker-secrets.json"
          rm -f "$RUNNER_TEMP/worker-secrets.json"

      - name: Hugging Face Space secrets
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          SHARED_SECRET: ${{ secrets.SHARED_SECRET }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          YTDLP_COOKIES: ${{ secrets.YTDLP_COOKIES }}
        run: |
          if [ -z "$HF_TOKEN" ]; then
            echo "::warning::HF_TOKEN is not set; skipping the Space."
            exit 0
          fi
          pip install --quiet "huggingface_hub>=0.25"
          python3 - <<'PY'
          import os
          from huggingface_hub import HfApi

          api = HfApi(token=os.environ["HF_TOKEN"])
          space = os.environ["SPACE_ID"]
          done = []
          for key in ["SHARED_SECRET", "GEMINI_API_KEY", "YTDLP_COOKIES"]:
              if os.environ.get(key):
                  api.add_space_secret(space, key, os.environ[key])
                  done.append(key)
          print("Space secrets set:", ", ".join(done) or "none")
          # The Space reads secrets at start-up; saving one restarts it.
          PY

      - name: Connect the Telegram bot to the Worker
        env:
          SHARED_SECRET: ${{ secrets.SHARED_SECRET }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
        run: |
          if [ -z "$SHARED_SECRET" ] || [ -z "$TELEGRAM_BOT_TOKEN" ]; then
            echo "SHARED_SECRET or TELEGRAM_BOT_TOKEN not set; skipping the bot."
            exit 0
          fi
          sleep 10 # let the new Worker version roll out
          result=$(curl -sS -X POST "$WORKER_URL/admin/setup" -H "Authorization: Bearer $SHARED_SECRET")
          echo "$result" | python3 -c '
          import json, sys
          r = json.load(sys.stdin)
          print("webhook_set:", r.get("webhook_set"), "| backend:", (r.get("backend") or {}).get("status"))
          sys.exit(0 if r.get("webhook_set") else 1)
          '
