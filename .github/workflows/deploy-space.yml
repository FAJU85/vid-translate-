name: Deploy backend to Hugging Face Space

# Uploads backend/ to the Space whenever it changes on main. Files removed from
# backend/app are also removed from the Space; other files on the Space are left alone.
# Authenticates with Hugging Face through the Space's "Trusted Publishers" setting
# (GitHub OIDC), so no HF_TOKEN secret is stored in this repository.

on:
  push:
    branches: [main]
    paths:
      - "backend/**"
      - ".github/workflows/deploy-space.yml"
  workflow_dispatch:

concurrency:
  group: deploy-space
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      id-token: write # lets the job request an OIDC token for Hugging Face
      contents: read
    env:
      SPACE_ID: vooom/Kavox
    steps:
      - uses: actions/checkout@v4

      - name: Install the hf CLI
        run: |
          curl -LsSf https://hf.co/cli/install.sh | bash
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      # Prints the (non-secret) identity GitHub presents to Hugging Face, to compare with the
      # Space's Trusted Publishers entry if the upload is refused. The token itself is not printed.
      - name: Show the identity sent to Hugging Face
        continue-on-error: true # diagnostics only; never block the upload
        run: |
          token=$(curl -sS -H "Authorization: Bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=https://huggingface.co" | jq -r .value)
          TOKEN="$token" python3 -c '
          import base64, json, os
          part = os.environ["TOKEN"].split(".")[1]
          claims = json.loads(base64.urlsafe_b64decode(part + "=" * (-len(part) % 4)))
          keys = ["repository", "repository_owner", "ref", "workflow", "workflow_ref", "environment", "sub"]
          print(json.dumps({k: claims.get(k) for k in keys}, indent=2))
          ' || true

      - name: Upload backend/ to the Space
        env:
          HF_OIDC_RESOURCE: spaces/${{ env.SPACE_ID }}
        run: >
          hf upload "$SPACE_ID" ./backend .
          --repo-type space
          --exclude "tests/*" --exclude "**/__pycache__/*"
          --delete "app/*"
          --commit-message "Deploy backend from ${GITHUB_SHA::7}"
