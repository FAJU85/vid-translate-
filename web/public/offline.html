<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#131C31">
<title>Offline · KAVOX</title>
<style>
  body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #131C31; color: #E2D6C6;
    font: 16px/1.55 "Plus Jakarta Sans", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; text-align: center; padding: 24px; box-sizing: border-box; }
  img { width: 72px; height: 72px; }
  h1 { color: #F9EBD6; font-size: 22px; margin: 16px 0 6px; }
  p { margin: 0 auto; max-width: 30ch; color: #ABA59E; }
  button { margin-top: 20px; padding: 12px 22px; border: 0; border-radius: 999px; background: #2AB8A1; color: #131C31; font: inherit; font-weight: 700; cursor: pointer; }
</style>
</head>
<body>
<main>
  <img src="/assets/kavox-logo.svg" alt="">
  <h1>You're offline</h1>
  <p>KAVOX needs a connection to translate and play videos. Check your connection and try again.</p>
  <button onclick="location.reload()">Try again</button>
</main>
<script>
  // Arabic when the visitor chose it on the site (or the browser asks for it).
  var lang = '';
  try { lang = localStorage.getItem('kavox_lang') || ''; } catch (e) {}
  if (!lang) lang = (document.cookie.match(/(?:^|;\s*)kavox_lang=(ar|en)\b/) || [])[1] || '';
  if (!lang) lang = (navigator.language || '').toLowerCase().indexOf('ar') === 0 ? 'ar' : 'en';
  if (lang === 'ar') {
    document.documentElement.lang = 'ar';
    document.documentElement.dir = 'rtl';
    document.title = 'غير متصل · KAVOX';
    document.querySelector('h1').textContent = 'أنت غير متصل';
    document.querySelector('p').textContent = 'يحتاج KAVOX إلى اتصال لترجمة الفيديوهات وتشغيلها. تحقق من اتصالك وحاول مرة أخرى.';
    document.querySelector('button').textContent = 'حاول مرة أخرى';
  }
</script>
</body>
</html>
